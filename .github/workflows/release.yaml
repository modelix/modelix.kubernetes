name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Run release-please
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # Keeps a release PR up to date that bumps the version in helm/modelix/Chart.yaml and updates the CHANGELOG.md.
      # Merging that PR creates the tag and the GitHub release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Tags and pull requests created with the default GITHUB_TOKEN don't trigger other workflows.
          # The tag has to trigger publish.yml and the release PR needs its CI checks.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
