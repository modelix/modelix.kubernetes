name: Build

on:
  push:
    branches:
      - 'main'
  pull_request: {}
  workflow_dispatch:

jobs:
  build:

    permissions:
      # Cf. https://github.com/marketplace/actions/publish-test-results#permissions
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: dashboard/package.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3

      - name: Install Skaffold
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          kubectl: '1.33.2'
          helm: '3.18.3'
          skaffold: '2.16.1'

      - name: Gradle assemble
        run: ./gradlew assemble

      - name: Kubernetes KinD Cluster
        id: kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          registry: true
          registry_name: my-registry
          registry_port: 5001
          registry_enable_delete: true
          config: ci/cluster.yaml

      - name: Install ingress controller
        run: ./ci/install-ingress.sh

      - name: Build Images
        run: skaffold build --filename='skaffold-test.yaml' --default-repo ${{ steps.kind.outputs.LOCAL_REGISTRY }} --insecure-registry ${{ steps.kind.outputs.LOCAL_REGISTRY }} --push --disable-multi-platform-build=true --file-output=tags.json

      - name: Deploy Cluster
        run: ./ci/deploy.sh

      - name: Run integration tests
        run: ./gradlew build -Pmodelix.baseurl="http://localhost:20080"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        # Also report in case the build failed
        if: always()
        with:
          files: |
            **/test-results/**/*.xml

      - name: Archive test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Archive test reports for introspection even if the build failed. They are most useful in this situation.
        if: always()
        with:
          name: test-report
          path: |
            */build/test-results
            */build/reports

  # Ensures that existing deployments can be upgraded to the current Helm chart without losing the database content.
  db-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.2.4: last release with PostgreSQL 17
        # 1.3.0: first release with PostgreSQL 18
        old-chart: ['1.2.4', '1.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubectl and helm
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          kubectl: '1.33.2'
          helm: '3.18.3'

      - name: Kubernetes KinD Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1

      - name: Upgrade from ${{ matrix.old-chart }}
        run: ./ci/test-db-upgrade.sh '${{ matrix.old-chart }}'
