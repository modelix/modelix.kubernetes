{{- if and (not .Values.ingress.certSecret) (not .Values.certmanager.enabled) }}
{{- $secretName := printf "%s-tls-secret" (include "modelix.fullname" .) }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingAnnotations := (get ((get $existingSecret "metadata") | default dict) "annotations") | default dict }}
{{- $existingData := (get $existingSecret "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $secretName }}"
  {{- if not .Values.ingress.tls.crt }}
  annotations:
    # The self-signed certificate is reused on upgrades as long as the hostname doesn't change.
    # Otherwise, browsers would show a certificate warning again after every upgrade.
    modelix.org/generated-for-hostname: "{{ .Values.ingress.hostname }}"
  {{- end }}
type: kubernetes.io/tls
data:
  {{ if .Values.ingress.tls.crt }}
  tls.crt: {{ .Values.ingress.tls.crt }}
  tls.key: {{ .Values.ingress.tls.key }}
  {{ else if and (eq (get $existingAnnotations "modelix.org/generated-for-hostname") .Values.ingress.hostname) (get $existingData "tls.crt") (get $existingData "tls.key") }}
  tls.crt: {{ get $existingData "tls.crt" }}
  tls.key: {{ get $existingData "tls.key" }}
  {{ else }}
  {{- $altNames := list .Values.ingress.hostname -}}
  {{- $ca := genCA "modelix-ca" 365 -}}
  {{- $cert := genSignedCert ( include "modelix.fullname" . ) nil $altNames 365 $ca -}}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{ end }}
