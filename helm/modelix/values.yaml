
nameOverride: ""
fullnameOverride: ""

dockerRegistry:
  image:
    repository: registry
    tag: 3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
    pullPolicy: IfNotPresent

oauthProxy:
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.15.5"
    pullPolicy: IfNotPresent

modelServer:
  image:
    repository: modelix/model-server
    tag: "19.4.1"
    pullPolicy: IfNotPresent

gitImport:
  image:
    repository: modelix/mps-git-import
    tag: "19.4.1"
    pullPolicy: IfNotPresent

proxy:
  image:
    repository: modelix/modelix-proxy
    tag: ""
    pullPolicy: IfNotPresent

versions:
  modelix:
    vncBaseImage: "0.9.4"

modelStorageSize: 3000Mi

# Maximal size of request body in mebibyte for ingress and proxy.
# Especially relevant for uploads in the workspace manager.
maxBodySize: 200

developmentMode: false

keycloak:
  adminPassword: "modelix"
  realm: "modelix"
  clientId: "modelix"
  clientSecret: ""
  loglevel: "warn"
  debug: false
  optimizedStartup: false
  image:
    repository: modelix/modelix-keycloak
    tag: ""
    pullPolicy: IfNotPresent

workspaces:
  enabled: true
  uploadsStorageSize: 5000Mi
  manager:
    memory: 600Mi
    image:
      repository: modelix/modelix-workspace-manager
      tag: ""
      pullPolicy: IfNotPresent
  client:
    # Ports as numbers which should be exposed from MPS.
    #
    # A use case is exposing custom servers running inside MPS.
    customExposedPorts: []
  job:
    image:
      repository: modelix/modelix-workspace-job
      tag: ""
      pullPolicy: IfNotPresent
  # Results of external (CI) builds that are uploaded using the org.modelix.workspaces Gradle plugin.
  artifacts:
    storageSize: 10Gi
    # Maximum size of a single uploaded artifact in mebibyte.
    # Independent of the global maxBodySize, which is used for all other requests.
    maxUploadSize: 2048
    # Older artifacts are deleted, unless they are used by a workspace instance.
    maxArtifactsPerWorkspace: 20

ingress:
  enabled: true
  hostname: "localhost"
  ingressClassName: "nginx"
  port: ""
  certSecret: ""
  tls:
    crt: ""
    key: ""

certmanager:
  # Setting this to true requires that appropriate cert-manager CRDs are
  # installed before as described here:
  # https://cert-manager.io/docs/installation/helm/#option-1-installing-crds-with-kubectl
  #
  # kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.0/cert-manager.yaml
  enabled: false

db:
  useGCloud: false
  user: "modelix"
  password: "modelix"
  db: "modelix"
  storage: 3000Mi

postgres:
  image:
    repository: postgres
    tag: 18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    pullPolicy: IfNotPresent
  # Runs pgautoupgrade as an init container if the database files were created by an older major version of
  # PostgreSQL. It does nothing on a fresh installation or if the database is already at the current major version.
  # The major version of this image has to match the major version of `postgres.image`.
  # Use the Debian variant and not the Alpine one, because the official postgres image is also based on Debian.
  # musl (Alpine) and glibc (Debian) sort strings differently, which invalidates indexes on text columns.
  autoupgrade:
    enabled: true
    image:
      repository: pgautoupgrade/pgautoupgrade
      tag: 18.6-trixie@sha256:dfad6ff6f88a6d52708f66fcb1b59c3dae481281e774e65aaaeb58564404e8a9
      pullPolicy: IfNotPresent

dockerProxy:
  prefix: ""
  secret: ""
  secret64: ""
  caCertificate: ""

internalDockerRegistry:
  # The internal docker registry does not use HTTPS.
  # Kubernetes only allows pulling images from such insecure repositories when they run on localhost.
  # Therefore, the internal docker registry is exposed through NodePort on each cluster node.
  # The node port on which it is exposed needs
  # to be known in advance because we need to specify the address for authentication.
  # The node port is configurable to allow
  # changing it in deployments where it conflicts with other statically assigned node ports.
  nodePort: 30033

serviceAccount: ""

authorization:
  enabled: true

httpProxy: ""

storageClassName: ""