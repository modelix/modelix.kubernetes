
nameOverride: ""
fullnameOverride: ""

dockerRegistry:
  image:
    repository: registry
    tag: 3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
    pullPolicy: IfNotPresent

oauthProxy:
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.15.5"
    pullPolicy: IfNotPresent
  # Session store of oauth2-proxy
  redis:
    image:
      repository: redis
      tag: "7.4.2"
      pullPolicy: IfNotPresent

modelServer:
  image:
    repository: modelix/model-server
    tag: "20.0.0"
    pullPolicy: IfNotPresent

gitImport:
  image:
    repository: modelix/mps-git-import
    tag: "20.0.0"
    pullPolicy: IfNotPresent

proxy:
  image:
    repository: modelix/modelix-proxy
    tag: ""
    pullPolicy: IfNotPresent

versions:
  modelix:
    vncBaseImage: "0.9.4"

modelStorageSize: 3000Mi

# Maximal size of request body in mebibyte for ingress and proxy.
# Especially relevant for uploads in the workspace manager.
maxBodySize: 200

developmentMode: false

keycloak:
  adminPassword: "modelix"
  realm: "modelix"
  clientId: "modelix"
  clientSecret: ""
  loglevel: "warn"
  debug: false
  optimizedStartup: false
  image:
    repository: modelix/modelix-keycloak
    tag: ""
    pullPolicy: IfNotPresent
  # Keycloak imports keycloak-realm.json only if the realm doesn't exist yet. Without this synchronization, changes of a
  # newer chart version and the `identityProviders` below don't reach an existing installation.
  # After each `helm install` and `helm upgrade`, a Job applies the Modelix roles and clients of keycloak-realm.json and
  # the `identityProviders` to the realm. Changes made to them in the Keycloak admin console may be overwritten.
  # Nothing is deleted. Roles, clients and identity providers that are removed from the configuration have to be
  # deleted manually.
  realmSync:
    enabled: true
    image:
      repository: adorsys/keycloak-config-cli
      tag: 6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "300Mi"
        cpu: "0.1"
      limits:
        memory: "300Mi"
        cpu: "1.0"
  # External identity providers users can log in with (identity brokering), e.g. ADFS, Entra ID or another Keycloak.
  # Requires `realmSync.enabled`.
  # Each entry is a Keycloak IdentityProviderRepresentation
  # (https://www.keycloak.org/docs-api/latest/rest-api/index.html#IdentityProviderRepresentation),
  # except for `clientSecret` and `mappers`.
  # Register https://<ingress.hostname>/realms/<keycloak.realm>/broker/<alias>/endpoint as the redirect URI at the
  # identity provider.
  identityProviders: []
  #  - alias: adfs
  #    displayName: "Company account"
  #    providerId: oidc
  #    config:
  #      issuer: https://sts.example.com/adfs
  #      authorizationUrl: https://sts.example.com/adfs/oauth2/authorize/
  #      tokenUrl: https://sts.example.com/adfs/oauth2/token/
  #      logoutUrl: https://sts.example.com/adfs/oauth2/logout
  #      userInfoUrl: https://sts.example.com/adfs/userinfo
  #      jwksUrl: https://sts.example.com/adfs/discovery/keys
  #      useJwksUrl: true
  #      validateSignature: true
  #      clientId: modelix
  #      clientAuthMethod: client_secret_post
  #      defaultScope: openid profile email
  #      syncMode: IMPORT
  #    # Read from an existing Kubernetes Secret. Don't put the secret into `config`.
  #    clientSecret:
  #      secretName: adfs-client
  #      secretKey: client-secret
  #    # IdentityProviderMapperRepresentations. The identityProviderAlias is set automatically.
  #    mappers:
  #      - name: admins
  #        identityProviderMapper: oidc-advanced-role-idp-mapper
  #        config:
  #          syncMode: FORCE
  #          claims: '[{"key":"groups","value":"modelix-admins"}]'
  #          role: modelix-admin

workspaces:
  enabled: true
  uploadsStorageSize: 5000Mi
  manager:
    memory: 600Mi
    image:
      repository: modelix/modelix-workspace-manager
      tag: ""
      pullPolicy: IfNotPresent
  client:
    # Ports as numbers which should be exposed from MPS.
    #
    # A use case is exposing custom servers running inside MPS.
    customExposedPorts: []
  job:
    image:
      repository: modelix/modelix-workspace-job
      tag: ""
      pullPolicy: IfNotPresent
  # Results of external (CI) builds that are uploaded using the org.modelix.workspaces Gradle plugin.
  artifacts:
    storageSize: 10Gi
    # Maximum size of a single uploaded artifact in mebibyte.
    # Independent of the global maxBodySize, which is used for all other requests.
    maxUploadSize: 2048
    # Older artifacts are deleted, unless they are used by a workspace instance.
    maxArtifactsPerWorkspace: 20

ingress:
  enabled: true
  hostname: "localhost"
  ingressClassName: "nginx"
  port: ""
  certSecret: ""
  tls:
    crt: ""
    key: ""

certmanager:
  # Setting this to true requires that appropriate cert-manager CRDs are
  # installed before as described here:
  # https://cert-manager.io/docs/installation/helm/#option-1-installing-crds-with-kubectl
  #
  # kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.0/cert-manager.yaml
  enabled: false

db:
  useGCloud: false
  user: "modelix"
  password: "modelix"
  db: "modelix"
  # Size of the PersistentVolumeClaim of the database.
  # If empty, new installations get 20Gi and existing installations keep the size of their existing claim,
  # because increasing it fails if the StorageClass doesn't allow volume expansion.
  # Set it explicitly if your deployment tool doesn't support Helm's `lookup` function (e.g. Argo CD).
  storage: ""

postgres:
  image:
    repository: postgres
    tag: 18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    pullPolicy: IfNotPresent
  # Runs pgautoupgrade as an init container if the database files were created by an older major version of
  # PostgreSQL. It does nothing on a fresh installation or if the database is already at the current major version.
  # The major version of this image has to match the major version of `postgres.image`.
  # Use the Debian variant and not the Alpine one, because the official postgres image is also based on Debian.
  # musl (Alpine) and glibc (Debian) sort strings differently, which invalidates indexes on text columns.
  autoupgrade:
    enabled: true
    image:
      repository: pgautoupgrade/pgautoupgrade
      tag: 18.6-trixie@sha256:dfad6ff6f88a6d52708f66fcb1b59c3dae481281e774e65aaaeb58564404e8a9
      pullPolicy: IfNotPresent

dockerProxy:
  # Prefix for images from Docker Hub, which are the images without a registry host such as `modelix/model-server`,
  # `postgres` or `docker.io/library/redis`. For example "artifactory.example.com/docker-remote/".
  # Images of other registries aren't changed by it. Use `registryMirrors` for them.
  prefix: ""
  # Mirrors for images of other registries than Docker Hub. Maps the registry host to the prefix that replaces it.
  # For example, with `quay.io: artifactory.example.com/quay-remote`, the image `quay.io/oauth2-proxy/oauth2-proxy`
  # is pulled from `artifactory.example.com/quay-remote/oauth2-proxy/oauth2-proxy`.
  registryMirrors: {}
  secret: ""
  secret64: ""
  caCertificate: ""

internalDockerRegistry:
  # The internal docker registry stores the images of the workspaces and does not use HTTPS.
  # The kubelet pulls these images from `pullAddress`. Kubernetes nodes only pull from a plain HTTP registry without
  # further configuration if it is reachable at localhost. Therefore, by default, the registry is exposed through a
  # NodePort on each cluster node and pulled from `localhost:<nodePort>`.
  #
  # If NodePorts aren't available, the registry can be exposed differently (for example with a LoadBalancer) and
  # `pullAddress` set accordingly. Any address other than localhost requires the container runtime of all nodes to
  # be configured to allow it as an insecure (HTTP) registry. For RKE2, for example, that is done in
  # /etc/rancher/rke2/registries.yaml:
  #
  #   mirrors:
  #     "10.0.0.10:5000":
  #       endpoint:
  #         - "http://10.0.0.10:5000"
  service:
    # NodePort, LoadBalancer or ClusterIP
    type: NodePort
    # Only used if the type is LoadBalancer.
    loadBalancerIP: ""
    annotations: {}
  # The node port on which it is exposed needs to be known in advance because we need to specify the address for
  # authentication. The node port is configurable to allow changing it in deployments where it conflicts with other
  # statically assigned node ports. Only used if the service type is NodePort.
  nodePort: 30033
  # host:port from which the kubelet pulls workspace images. Defaults to `localhost:<nodePort>`.
  # Required if the service type isn't NodePort. For a LoadBalancer, this is usually `<load balancer IP>:5000`.
  pullAddress: ""

# Name of an existing service account to use instead of the one created by this chart.
serviceAccount: ""

rbac:
  # Creates a namespaced Role and RoleBinding for the service account (see `serviceAccount`) with the permissions the
  # workspace-manager needs to manage workspace instances. Disable it if the RBAC objects are managed outside this chart.
  create: true

authorization:
  enabled: true

httpProxy: ""

storageClassName: ""